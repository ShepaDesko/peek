public_url = "http://127.0.0.1:8099"
default_language = "fr"
master_key_file = "F:\\Peek\\test\\e2e\\.e2e\\master.key"
data_dir = "F:\\Peek\\test\\e2e\\.e2e"
update_check = false

[server]
internal_listen = "127.0.0.1:8099"
public_listen = "127.0.0.1:8100"

[database]
driver = "sqlite"
dsn = "F:\\Peek\\test\\e2e\\.e2e\\peek.db"

[storage]
backend = "local"
path = "F:\\Peek\\test\\e2e\\.e2e\\files"

[security]
anonymous_create = true
max_passphrase_attempts = 3

[security.rate_read]
burst = 0

[security.rate_api]
burst = 0

[security.rate_create]
burst = 0

# The suite signs in dozens of times; the login bucket is covered by the Go
# tests, and throttling it here would only make the suite flaky.
[security.rate_login]
burst = 0

[branding]
service_name = "Coffre E2E"
primary_color = "#1d4ed8"

[backup]
enabled = false
dir = "F:\\Peek\\test\\e2e\\.e2e\\backups"

[log]
level = "warn"
format = "text"
