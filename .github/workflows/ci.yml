name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  go:
    name: Go — lint, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal tools)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./cmd/... ./internal/... ./tools/...

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

      # The race detector is the point of this job: the single-view guarantee
      # is a concurrency property.
      - name: go test -race
        run: go test -race -count=1 ./cmd/... ./internal/... ./tools/...

      - name: build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/...

  web:
    name: Web — lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run lint
        working-directory: web

      - run: npx tsc -b
        working-directory: web

      # Runs the shared crypto vectors: this is what keeps the TypeScript and
      # Go implementations byte-identical.
      - run: npm run test
        working-directory: web

      - run: npm run format:check
        working-directory: web

      - run: npm run build
        working-directory: web

  crypto-parity:
    name: Crypto — Go and TypeScript agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Regenerating the vectors must not change them: if it does, the format
      # changed without a version bump.
      - name: vectors are reproducible
        run: |
          go run ./tools/genvectors
          git diff --exit-code crypto/vectors/v1.json

      - run: go test ./internal/crypto/...
      - run: npm ci && npm run test
        working-directory: web

  security:
    name: Security — govulncheck, npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./cmd/... ./internal/... ./tools/...

      - name: npm audit
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high

  e2e:
    name: End to end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: build the binary with the interface embedded
        run: make build

      - name: install Playwright
        working-directory: test/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: run the suite
        working-directory: test/e2e
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test/e2e/playwright-report
          retention-days: 7

  install:
    name: Package install — ${{ matrix.distro }}
    runs-on: ubuntu-latest
    needs: [go, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian-12
            image: debian:12
            pkg: deb
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            pkg: deb
          - distro: rocky-9
            image: rockylinux:9
            pkg: rpm
    container:
      image: ${{ matrix.image }}
    steps:
      - name: install prerequisites
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq
            apt-get install -y -qq curl ca-certificates systemd >/dev/null
          else
            (dnf install -y -q curl ca-certificates systemd || yum install -y -q curl ca-certificates systemd) >/dev/null
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # The container has no PID 1 systemd, so the packaging scripts are
      # exercised through a direct run of the binary instead: setup writes the
      # configuration, doctor checks it, and the service answers /readyz.
      - name: setup, serve and check
        run: |
          set -eux
          CGO_ENABLED=0 go build -trimpath -o /usr/bin/peek ./cmd/peek
          useradd --system --home-dir /var/lib/peek --no-create-home --shell /sbin/nologin peek || true
          install -d -o peek -g peek -m 0750 /var/lib/peek /var/backups/peek
          install -d -m 0750 /etc/peek
          peek setup --non-interactive --force \
            --public-url http://127.0.0.1:8080 \
            --mode internal \
            --internal-listen 127.0.0.1:8080 \
            --anonymous-create
          peek config check
          peek serve &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/readyz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/readyz
          peek doctor || true
          peek backup --to /var/backups/peek
          peek backup --list

  upgrade:
    name: Upgrade N-1 → N and rollback
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Build the previous tag, create data with it, upgrade in place, and
      # check the data survived. Skipped until there is a previous tag.
      - name: previous release
        id: previous
        run: |
          tag=$(git tag --sort=-v:refname | head -1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then echo "no tag yet, skipping"; fi

      - name: upgrade in place
        if: steps.previous.outputs.tag != ''
        run: |
          set -eux
          git worktree add /tmp/previous "${{ steps.previous.outputs.tag }}"
          (cd /tmp/previous && CGO_ENABLED=0 go build -o /tmp/peek-old ./cmd/peek)
          CGO_ENABLED=0 go build -o /tmp/peek-new ./cmd/peek

          mkdir -p /tmp/inst
          export PEEK_CONFIG=/tmp/inst/peek.toml
          /tmp/peek-old setup --non-interactive --force \
            --config /tmp/inst/peek.toml \
            --public-url http://127.0.0.1:8099 \
            --internal-listen 127.0.0.1:8099 \
            --mode internal --anonymous-create \
            --data-dir /tmp/inst --dsn /tmp/inst/peek.db
          /tmp/peek-old serve --config /tmp/inst/peek.toml &
          old_pid=$!
          sleep 3
          curl -fsS http://127.0.0.1:8099/readyz
          /tmp/peek-old backup --config /tmp/inst/peek.toml --to /tmp/inst/backups
          kill $old_pid; sleep 1

          # The new binary applies any pending migration at startup.
          /tmp/peek-new serve --config /tmp/inst/peek.toml &
          new_pid=$!
          sleep 3
          curl -fsS http://127.0.0.1:8099/readyz
          /tmp/peek-new migrate status --config /tmp/inst/peek.toml
          kill $new_pid

          # Rollback: the old binary must still start on the same data.
          /tmp/peek-old serve --config /tmp/inst/peek.toml &
          back_pid=$!
          sleep 3
          curl -fsS http://127.0.0.1:8099/readyz
          kill $back_pid
