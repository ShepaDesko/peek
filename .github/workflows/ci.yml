name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to the patch level, not the minor: 1.26.7 shipped with twelve
  # known net/http, crypto/tls and crypto/x509 advisories, and govulncheck in
  # CI is what caught it. A security product does not ship on a toolchain with
  # open advisories in the code that terminates its own TLS.
  GO_VERSION: "1.26.11"
  NODE_VERSION: "22"

jobs:
  go:
    name: Go — lint, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal tools)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./cmd/... ./internal/... ./tools/...

      # Built from source with this job's toolchain: the prebuilt binaries the
      # action installs are compiled with an older Go than this module targets,
      # and refuse to load the configuration.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run --timeout=5m

      # The race detector is the point of this job: the single-view guarantee
      # is a concurrency property.
      - name: go test -race
        run: go test -race -count=1 ./cmd/... ./internal/... ./tools/...

      - name: build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/...

  web:
    name: Web — lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - run: npm run lint
        working-directory: web

      - run: npx tsc -b
        working-directory: web

      # Runs the shared crypto vectors: this is what keeps the TypeScript and
      # Go implementations byte-identical.
      - run: npm run test
        working-directory: web

      - run: npm run format:check
        working-directory: web

      - run: npm run build
        working-directory: web

  crypto-parity:
    name: Crypto — Go and TypeScript agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Regenerating the vectors must not change them: if it does, the format
      # changed without a version bump.
      - name: vectors are reproducible
        run: |
          go run ./tools/genvectors
          git diff --exit-code crypto/vectors/v1.json

      # The committed OpenAPI document is generated from the route table. A
      # diff here means a route changed and the copy in the repository did not.
      - name: the API description is current
        run: |
          go run ./tools/genopenapi
          git diff --exit-code api/openapi.json

      - run: go test ./internal/crypto/...
      - run: npm ci && npm run test
        working-directory: web

  security:
    name: Security — govulncheck, npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./cmd/... ./internal/... ./tools/...

      - name: npm audit
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=high

  e2e:
    name: End to end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: frontend dependencies
        working-directory: web
        run: npm ci

      - name: build the binary with the interface embedded
        run: make build

      # The size budgets from section 13 of the brief. This job is the only
      # one that has both the binary and the built interface to hand, so it is
      # where the measurement belongs. A budget nobody measures is a wish.
      - name: size budgets
        run: make budget

      - name: install Playwright
        working-directory: test/e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: run the suite
        working-directory: test/e2e
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test/e2e/playwright-report
          retention-days: 7

  binary:
    name: Build the Linux binary
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: build with the interface embedded
        run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: peek-linux-amd64
          path: bin/peek
          retention-days: 1

  install:
    name: Install on ${{ matrix.distro }}
    runs-on: ubuntu-latest
    needs: [binary]
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian-12
            image: debian:12
          - distro: ubuntu-24.04
            image: ubuntu:24.04
          - distro: rocky-9
            image: rockylinux:9
    container:
      image: ${{ matrix.image }}
    steps:
      # No toolchain action runs inside the container on purpose: the binary
      # arrives built, which is also how a customer receives it.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: peek-linux-amd64
          path: /tmp/peek-bin

      - name: install, configure and exercise
        run: |
          set -eux
          install -m 0755 /tmp/peek-bin/peek /usr/bin/peek

          # Run the package's own post-installation script rather than a
          # hand-rolled useradd. Creating the account here instead is how a
          # broken scriptlet went unnoticed: the RPM one used Debian's
          # addgroup, which does not exist on RHEL, so it aborted and the
          # service account was never created.
          case "${{ matrix.distro }}" in
            rocky-*) sh packaging/rpm/postinstall.sh 1 ;;
            *)       sh packaging/deb/postinst.sh configure ;;
          esac

          # What the scriptlet must have produced, on every distribution.
          getent passwd peek
          test "$(getent passwd peek | cut -d: -f7)" != ""
          test "$(stat -c '%U:%G %a' /var/lib/peek)" = "peek:peek 750"
          test "$(stat -c '%U:%G %a' /var/lib/peek/files)" = "peek:peek 750"
          test "$(stat -c '%U:%G %a' /var/backups/peek)" = "peek:peek 750"
          test "$(stat -c '%U:%G %a' /etc/peek)" = "root:peek 750"

          peek version
          peek setup --non-interactive --force             --public-url http://127.0.0.1:8080             --mode internal             --internal-listen 127.0.0.1:8080             --anonymous-create
          peek config check

          # The configuration must be readable by the service account: this is
          # the failure that a real Debian install surfaced first.
          test "$(stat -c '%U:%G %a' /etc/peek/peek.toml)" = "root:peek 640"
          test "$(stat -c '%U:%G %a' /etc/peek/master.key)" = "peek:peek 400"

          peek serve &
          server=$!

          # The bare images have no HTTP client, so readiness is taken from the
          # product's own diagnostic, which dials the listener.
          ready=0
          for _ in $(seq 1 30); do
            if peek doctor 2>&1 | grep -q "listener internal .*answers"; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"

          peek doctor || true
          peek backup --to /var/backups/peek
          peek backup --list
          # A root-run backup must not take ownership of the database.
          test "$(stat -c '%U' /var/lib/peek/peek.db)" = "peek"
          kill "$server"

  upgrade:
    name: Upgrade N-1 → N and rollback
    runs-on: ubuntu-latest
    needs: [go]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Build the previous tag, create data with it, upgrade in place, and
      # check the data survived. Skipped until there is a previous tag.
      - name: previous release
        id: previous
        run: |
          tag=$(git tag --sort=-v:refname | head -1)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then echo "no tag yet, skipping"; fi

      - name: upgrade in place
        if: steps.previous.outputs.tag != ''
        run: |
          set -eux
          git worktree add /tmp/previous "${{ steps.previous.outputs.tag }}"
          (cd /tmp/previous && CGO_ENABLED=0 go build -o /tmp/peek-old ./cmd/peek)
          CGO_ENABLED=0 go build -o /tmp/peek-new ./cmd/peek

          mkdir -p /tmp/inst
          export PEEK_CONFIG=/tmp/inst/peek.toml

          # 1.0.2 and earlier keep the master key at /etc/peek/master.key and
          # the backups at /var/backups/peek whatever --config and --data-dir
          # say, so the previous binary cannot configure an instance under
          # /tmp as an ordinary user: it writes the file it was asked for and
          # then dies on "mkdir: permission denied". That is fixed from 1.1.0
          # on, where a configuration outside /etc/peek roots everything
          # beside itself. Until 1.1.0 is the previous tag these two lines
          # keep the job doing its own work — the upgrade and the rollback —
          # rather than re-finding a bug that is already fixed.
          # Remove them once `git tag --sort=-v:refname | head -1` is v1.1.0.
          sudo install -d -o "$USER" -m 0750 /etc/peek
          sudo install -d -o "$USER" -m 0750 /var/backups/peek

          /tmp/peek-old setup --non-interactive --force \
            --config /tmp/inst/peek.toml \
            --public-url http://127.0.0.1:8099 \
            --internal-listen 127.0.0.1:8099 \
            --mode internal --anonymous-create \
            --data-dir /tmp/inst --dsn /tmp/inst/peek.db
          /tmp/peek-old serve --config /tmp/inst/peek.toml &
          old_pid=$!
          sleep 3
          curl -fsS http://127.0.0.1:8099/readyz
          /tmp/peek-old backup --config /tmp/inst/peek.toml --to /tmp/inst/backups
          kill $old_pid; sleep 1

          # The new binary applies any pending migration at startup.
          /tmp/peek-new serve --config /tmp/inst/peek.toml &
          new_pid=$!
          sleep 3
          curl -fsS http://127.0.0.1:8099/readyz
          /tmp/peek-new migrate status --config /tmp/inst/peek.toml
          kill $new_pid

          # Rollback: the old binary must still start on the same data.
          /tmp/peek-old serve --config /tmp/inst/peek.toml &
          back_pid=$!
          sleep 3
          curl -fsS http://127.0.0.1:8099/readyz
          kill $back_pid
